[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexusai-backend"
version = "0.1.0"
description = "NexusAI enterprise AI workspace backend"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "email-validator>=2.2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "lxml>=5,<7",
  "langgraph>=0.6,<2",
  "openai>=1.60,<3",
  "pgvector>=0.3.6,<1",
  "psycopg[binary]>=3.2,<4",
  "pymupdf>=1.25,<2",
  "pydantic-settings>=2.7,<3",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "redis>=5.2,<7",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "sqlglot>=27,<30",
  "trafilatura>=2,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the local PostgreSQL/pgvector service"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
